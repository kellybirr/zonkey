name: Build NuGet Packages

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x
            10.0.x

      - name: Get version from release tag
        id: version
        run: |
          $version = "${{ github.event.release.tag_name }}".TrimStart('v')
          "VERSION=$version" | Out-File -Append $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore Zonkey.sln

      - name: Build Release
        run: dotnet build Zonkey.sln -c Release --no-restore -p:Version=${{ steps.version.outputs.VERSION }}

      - name: Run Tests
        run: dotnet test Zonkey.sln -c Release --no-build

      - name: Upload NuGet Packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: src/**/bin/Release/*.nupkg
