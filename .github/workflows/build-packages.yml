name: Build NuGet Packages

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # required for NuGet trusted publishing (OIDC)

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Get version from release tag
        id: version
        run: |
          $version = "${{ github.event.release.tag_name }}".TrimStart('v')
          "VERSION=$version" | Out-File -Append $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore Zonkey.sln

      - name: Build Release
        run: dotnet build Zonkey.sln -c Release --no-restore -p:Version=${{ steps.version.outputs.VERSION }} -p:ContinuousIntegrationBuild=true

      - name: Run Tests
        run: dotnet test Zonkey.sln -c Release --no-build

      - name: Upload NuGet Packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            src/**/bin/Release/*.nupkg
            tools/**/bin/Release/*.nupkg

      # Trusted Publishing: exchanges the GitHub OIDC token for a one-time,
      # 1-hour API key minted by nuget.org — no stored secrets involved.
      - name: NuGet login (OIDC -> temp API key)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: KellyBirr

      # Every package is produced by GeneratePackageOnBuild, so a project missing that property
      # yields no .nupkg — and the push loop below would simply iterate over nothing and report
      # success. That is exactly how 7.0.1 shipped four packages instead of five. Assert the set
      # before pushing, so a silently-missing package fails the release instead of passing it.
      - name: Verify expected packages were produced
        shell: pwsh
        run: |
          $expected = @(
            'Zonkey.Data', 'Zonkey.Data.MsSql', 'Zonkey.Text', 'Zonkey.Mocks', 'zonkey.scaffold'
          )
          $found = Get-ChildItem -Path src,tools -Recurse -Filter *.nupkg |
                   Where-Object FullName -like '*\bin\Release\*'
          Write-Host "Found $($found.Count) package(s):"
          $found | ForEach-Object { Write-Host "  $($_.Name)" }

          $missing = $expected | Where-Object { $id = $_; -not ($found | Where-Object Name -like "$id.*.nupkg") }
          if ($missing) {
            Write-Error "Missing expected package(s): $($missing -join ', '). A project is probably missing <GeneratePackageOnBuild>."
            exit 1
          }

      - name: Publish to NuGet.org
        shell: pwsh
        run: |
          Get-ChildItem -Path src,tools -Recurse -Filter *.nupkg | Where-Object FullName -like '*\bin\Release\*' | ForEach-Object {
            dotnet nuget push $_.FullName --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
          }
