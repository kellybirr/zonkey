services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Zonkey#Test123"
    ports:
      # Host port 1434 avoids clashing with a locally installed SQL Server on 1433
      - "1434:1433"
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "Zonkey#Test123" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: zonkey
      POSTGRES_PASSWORD: zonkey
      POSTGRES_DB: zonkey_test
    ports:
      # Host port 5433 avoids clashing with a locally running PostgreSQL on 5432
      - "5433:5432"
    healthcheck:
      test: pg_isready -U zonkey
      interval: 10s
      timeout: 5s
      retries: 5

  mysql:
    image: mysql:8
    # MySQL on Linux defaults to lower_case_table_names=0 (case-sensitive table
    # names), unlike SQL Server (case-insensitive collation) and PostgreSQL
    # (folds unquoted identifiers to lowercase). Force case-insensitive table
    # names so the shared Integration test suites -- which mix PascalCase
    # (DataItemAttribute-driven) and lowercase (raw-SQL) table references --
    # behave the same way here as on the other two providers. Must be set at
    # first startup; safe here since the container has no persistent volume.
    command: --lower-case-table-names=1
    environment:
      MYSQL_ROOT_PASSWORD: zonkey
      MYSQL_DATABASE: zonkey_zoo
    ports:
      # Host port 3308 avoids clashing with a locally running MySQL on 3306/3307
      - "3308:3306"
    healthcheck:
      test: mysqladmin ping -h localhost -u root -pzonkey
      interval: 10s
      timeout: 5s
      retries: 10
